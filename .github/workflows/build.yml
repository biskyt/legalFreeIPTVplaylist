name: Build playlists

on:
  schedule:
    - cron: "17 4 * * *"   # daily, 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "config/**", "pyproject.toml", ".github/workflows/build.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      # Internet Archive metadata and stream health, kept between runs.
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-

      # Fails (and leaves the previously deployed site live) if any feed is broken or too small.
      - run: python -m freeplaylist build --out site --state state

      # TV guide: iptv-org's grabber fetches the channels the build listed in state/epg.channels.xml. If it fails
      # or runs out of time, the previous guide (kept in state/) is published instead, so playlists still deploy.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Grab TV guide
        continue-on-error: true
        timeout-minutes: 75
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg "$RUNNER_TEMP/epg"
          cd "$RUNNER_TEMP/epg"
          npm ci --no-audit --no-fund
          npm run grab --- --channels="$GITHUB_WORKSPACE/state/epg.channels.xml" --days=2 --maxConnections=5 --delay=250 \
            --output="$RUNNER_TEMP/guide.xml" --gzip="$RUNNER_TEMP/guide.xml.gz"
          mv "$RUNNER_TEMP/guide.xml.gz" "$GITHUB_WORKSPACE/state/epg.xml.gz"
      - name: Publish TV guide
        run: |
          if [ -f state/epg.xml.gz ]; then cp state/epg.xml.gz site/epg.xml.gz; else echo "no guide yet"; fi

      - uses: actions/cache/save@v4
        if: always() && hashFiles('state/*') != ''
        with:
          path: state
          key: state-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
