name: Build playlists

# Nightly and on demand only: harvesting is slow and shares other people's servers, so merges don't start a
# build; changes take effect on the next run (or start one from the Actions tab).
on:
  schedule:
    - cron: "17 4 * * *"   # daily, 04:17 UTC
  workflow_dispatch:
    inputs:
      full:
        description: "Harvest and check everything now, ignoring the nightly schedule (slow)"
        type: boolean
        default: false
      only:
        description: "Or harvest only these sources (comma-separated: curated, internet-archive-series, internet-archive-movies, wikimedia-commons)"
        type: string
        default: ""

permissions:
  contents: write   # to save state/ on the `state` branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      BUILD: --out site --state state ${{ inputs.full && '--all' || '' }} ${{ inputs.only && format('--only={0}', inputs.only) || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      # state/ (each source's snapshot and stream health) lives on the
      # `state` branch as one compressed file: free, permanent, and replaced each night by a single commit, so the
      # repo doesn't grow.
      - name: Restore state
        id: restore
        uses: ./.github/actions/restore-state

      # The build runs in parts, one step each, so the Actions page shows how far it has got (a step's log only
      # appears once it finishes). Each harvest step refreshes one source's snapshot if it's due tonight
      # (config/schedule.yaml) and is quick otherwise; the check steps test tonight's share of streams; the
      # publish step builds the site from the snapshots and fails (leaving the deployed site live) if any feed
      # is broken or too small.
      - name: Harvest curated films
        run: python -m freeplaylist build $BUILD --phase harvest --source curated
      - name: Harvest Internet Archive series
        run: python -m freeplaylist build $BUILD --phase harvest --source internet-archive-series
      - name: Harvest Wikimedia Commons
        run: python -m freeplaylist build $BUILD --phase harvest --source wikimedia-commons
      - name: Harvest Internet Archive movies
        run: python -m freeplaylist build $BUILD --phase harvest --source internet-archive-movies
      - name: Check live streams
        run: python -m freeplaylist build $BUILD --phase check-live
      - name: Check movies and series
        run: python -m freeplaylist build $BUILD --phase check-vod
      - name: Build playlists
        run: python -m freeplaylist build $BUILD --phase publish

      # Files earlier versions kept in state/ and nothing reads any more: everything but the current sources'
      # snapshots and the stream health and film caches.
      - name: Remove obsolete state
        if: always() && steps.restore.outcome == 'success'
        run: |
          find state -mindepth 1 -maxdepth 1 ! -name snapshots ! -name health.json ! -name ia_cache.json \
            ! -name wikidata.json -exec rm -rf {} +
          find state/snapshots -type f ! -name curated.json ! -name 'internet-archive-*.json' \
            ! -name wikimedia-commons.json -delete 2>/dev/null || true

      - name: Save state
        if: always() && steps.restore.outcome == 'success' && hashFiles('state/**') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/state-branch"
          tar -czf "$RUNNER_TEMP/state-branch/state.tar.gz" state
          cd "$RUNNER_TEMP/state-branch"
          git init -q -b state
          git add state.tar.gz
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Build state from run ${{ github.run_id }}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" state

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
