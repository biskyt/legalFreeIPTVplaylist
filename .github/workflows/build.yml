name: Build playlists

# Nightly and on demand only: harvesting is slow and shares other people's servers, so merges don't start a
# build; changes take effect on the next run (or start one from the Actions tab).
on:
  schedule:
    - cron: "17 4 * * *"   # daily, 04:17 UTC
  workflow_dispatch:
    inputs:
      full:
        description: "Harvest and check everything now, ignoring the nightly schedule (slow)"
        type: boolean
        default: false
      only:
        description: "Or harvest only these sources (comma-separated: iptv-org, curated, internet-archive-series, internet-archive-movies, wikimedia-commons, open-beelden)"
        type: string
        default: ""

permissions:
  contents: write   # to save state/ on the `state` branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      # state/ (each source's snapshot, stream health and other caches) lives on the `state` branch as one
      # compressed file: free, permanent, and replaced each night by a single commit, so the repo doesn't grow.
      - name: Restore state
        id: restore
        run: |
          # Exit code 2 means the branch doesn't exist (first run). Any other failure stops the job rather than
          # starting empty, which would later overwrite the saved state with a partial one.
          set +e; git ls-remote --exit-code --heads origin state > /dev/null; found=$?; set -e
          if [ "$found" = 2 ]; then
            echo "no saved state yet: this run harvests everything"
          elif [ "$found" = 0 ]; then
            git fetch --depth 1 origin state
            git show FETCH_HEAD:state.tar.gz | tar -xz
          else
            echo "couldn't check for saved state (exit $found)"; exit 1
          fi

      # Fails (and leaves the previously deployed site live) if any feed is broken or too small.
      # Only tonight's share of sources and stream checks runs (config/schedule.yaml); the rest come from state/.
      - run: python -m freeplaylist build --out site --state state ${{ inputs.full && '--all' || '' }} ${{ inputs.only && format('--only={0}', inputs.only) || '' }}

      # TV guide (see src/freeplaylist/epg.py). The grabber scrapes tonight's group of slow channels for 8 days
      # ahead; then `freeplaylist epg` downloads the ready-made guides and merges everything. If either fails,
      # the previous guide (kept in state/) is published, so the playlists still deploy.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Grab tonight's slow guides
        continue-on-error: true
        timeout-minutes: 60
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg "$RUNNER_TEMP/epg"
          cd "$RUNNER_TEMP/epg"
          npm ci --no-audit --no-fund
          npm run grab --- --channels="$GITHUB_WORKSPACE/state/epg/channels.xml" --days=8 --maxConnections=5 \
            --delay=250 --output="$RUNNER_TEMP/grabbed.xml" --gzip="$RUNNER_TEMP/grabbed.xml.gz"
      - name: Build TV guide
        continue-on-error: true
        timeout-minutes: 45
        run: |
          python -m freeplaylist epg --state state --out "$RUNNER_TEMP/epg.xml.gz" --grabbed "$RUNNER_TEMP/grabbed.xml.gz"
          mv "$RUNNER_TEMP/epg.xml.gz" state/epg.xml.gz
      - name: Publish TV guide
        run: |
          if [ -f state/epg.xml.gz ]; then cp state/epg.xml.gz site/epg.xml.gz; else echo "no guide yet"; fi

      - name: Save state
        if: always() && steps.restore.outcome == 'success' && hashFiles('state/**') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/state-branch"
          tar -czf "$RUNNER_TEMP/state-branch/state.tar.gz" state
          cd "$RUNNER_TEMP/state-branch"
          git init -q -b state
          git add state.tar.gz
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Build state from run ${{ github.run_id }}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" state

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
