name: Build playlists

# Nightly and on demand only: harvesting is slow and shares other people's servers, so merges don't start a
# build; changes take effect on the next run (or start one from the Actions tab).
on:
  schedule:
    - cron: "17 4 * * *"   # daily, 04:17 UTC
  workflow_dispatch:
    inputs:
      full:
        description: "Harvest and check everything now, ignoring the nightly schedule (slow)"
        type: boolean
        default: false
      only:
        description: "Or harvest only these sources (comma-separated: iptv-org, curated, internet-archive-series, internet-archive-movies, wikimedia-commons)"
        type: string
        default: ""

permissions:
  contents: write   # to save state/ on the `state` branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      BUILD: --out site --state state ${{ inputs.full && '--all' || '' }} ${{ inputs.only && format('--only={0}', inputs.only) || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      # state/ (each source's snapshot, stream health and other caches) lives on the `state` branch as one
      # compressed file: free, permanent, and replaced each night by a single commit, so the repo doesn't grow.
      - name: Restore state
        id: restore
        run: |
          # Exit code 2 means the branch doesn't exist (first run). Any other failure stops the job rather than
          # starting empty, which would later overwrite the saved state with a partial one.
          set +e; git ls-remote --exit-code --heads origin state > /dev/null; found=$?; set -e
          if [ "$found" = 2 ]; then
            echo "no saved state yet: this run harvests everything"
          elif [ "$found" = 0 ]; then
            git fetch --depth 1 origin state
            git show FETCH_HEAD:state.tar.gz | tar -xz
          else
            echo "couldn't check for saved state (exit $found)"; exit 1
          fi

      # The build runs in parts, one step each, so the Actions page shows how far it has got (a step's log only
      # appears once it finishes). Each harvest step refreshes one source's snapshot if it's due tonight
      # (config/schedule.yaml) and is quick otherwise; the check steps test tonight's share of streams; the
      # publish step builds the site from the snapshots and fails (leaving the deployed site live) if any feed
      # is broken or too small.
      - name: Harvest curated films
        run: python -m freeplaylist build $BUILD --phase harvest --source curated
      - name: Harvest Internet Archive series
        run: python -m freeplaylist build $BUILD --phase harvest --source internet-archive-series
      - name: Harvest Wikimedia Commons
        run: python -m freeplaylist build $BUILD --phase harvest --source wikimedia-commons
      - name: Harvest Internet Archive movies
        run: python -m freeplaylist build $BUILD --phase harvest --source internet-archive-movies
      - name: Harvest live channels (iptv-org and broadcaster websites)
        run: python -m freeplaylist build $BUILD --phase harvest --source iptv-org
      - name: Check live streams
        run: python -m freeplaylist build $BUILD --phase check-live
      - name: Check movies and series
        run: python -m freeplaylist build $BUILD --phase check-vod
      - name: Build playlists
        run: python -m freeplaylist build $BUILD --phase publish

      # TV guide (see src/freeplaylist/epg.py). First the ready-made guides are downloaded; then the grabber
      # scrapes tonight's group of the channels none of them covered, for 8 days ahead; then everything is
      # merged. If any step fails, the previous guide (kept in state/) is published, so the playlists still deploy.
      - name: Download ready-made guides
        continue-on-error: true
        timeout-minutes: 30
        run: python -m freeplaylist epg fast --state state --fast "$RUNNER_TEMP/fast-epg.xml.gz"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Grab tonight's other guides
        continue-on-error: true
        timeout-minutes: 60
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg "$RUNNER_TEMP/epg"
          cd "$RUNNER_TEMP/epg"
          npm ci --no-audit --no-fund
          # The grabber logs a line per request (and per failure); keep every 100th and a count of failures.
          set -o pipefail
          NODE_OPTIONS=--max-old-space-size=6144 npm run grab --- \
            --channels="$GITHUB_WORKSPACE/state/epg/channels.xml" --days=8 --maxConnections=5 --delay=250 \
            --output="$RUNNER_TEMP/grabbed.xml" --gzip="$RUNNER_TEMP/grabbed.xml.gz" 2>&1 |
            awk '/^\[info\] +\[[0-9]+\/[0-9]+\]/ { if (++n % 100 == 0) { print; fflush() } next }
                 /^\[info\] +ERR:/ { e++; next }
                 { print; fflush() }
                 END { print n " requests, " e + 0 " failed" }'
      - name: Merge TV guide
        continue-on-error: true
        timeout-minutes: 30
        run: |
          python -m freeplaylist epg merge --state state --fast "$RUNNER_TEMP/fast-epg.xml.gz" \
            --grabbed "$RUNNER_TEMP/grabbed.xml.gz" --out "$RUNNER_TEMP/epg.xml.gz"
          mv "$RUNNER_TEMP/epg.xml.gz" state/epg.xml.gz
      - name: Publish TV guide
        run: |
          if [ -f state/epg.xml.gz ]; then cp state/epg.xml.gz site/epg.xml.gz; else echo "no guide yet"; fi

      - name: Save state
        if: always() && steps.restore.outcome == 'success' && hashFiles('state/**') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/state-branch"
          tar -czf "$RUNNER_TEMP/state-branch/state.tar.gz" state
          cd "$RUNNER_TEMP/state-branch"
          git init -q -b state
          git add state.tar.gz
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Build state from run ${{ github.run_id }}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" state

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
