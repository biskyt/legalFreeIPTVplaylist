    logo: https://ir.voanews.com/Content/responsive/VOA/img/webApp/ico-192x192.png
    page: https://ir.voanews.com/live/video/86
    language: fas
    countries: [IR]
    license: Public domain (material produced by the Voice of America)
    description: Voice of America's Persian-language television channel.
  - id: VoATVChina.cn@SD
    title: VOA Chinese TV
    kind: live
    group: "CN | News"
    url: https://voa-ingest.akamaized.net/hls/live/2033878/tvmc08/playlist.m3u8
