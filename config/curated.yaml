# Hand-picked items with a known licence. Each needs a `source` with an entry in credits.yaml.
#
# A direct item looks like:
#   - {id: example.live, title: Example, kind: live, group: "Live: News", url: https://..., source: <credit key>,
#      license: ..., page: https://...}
#
# Internet Archive items (`ia:`) are resolved to their best MP4 file; the licence given here is used as-is.
# Direct items (`url:`) are published as given (live streams are still health-checked).

