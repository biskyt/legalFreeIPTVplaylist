# Rules that decide which iptv-org streams count as official, legally free streams.
# See README "How live channels are vetted". Matching is on the stream URL's host name (and path where noted).
# Every platform named here needs a matching entry in credits.yaml (a test checks this).

# Free, ad-supported streaming services (known in the industry as FAST). Their channels are grouped under the
# service's name, e.g. "US | Pluto TV".
# `host` matches the host name or any parent domain; `path_prefix` / `host_prefix` (optional) must also match.
platforms:
  - name: Pluto TV
    credit: pluto-tv
    host: jmp2.uk          # third-party redirector to Pluto TV's public streams, used by iptv-org
    path_prefix: /plu-
  - name: Samsung TV Plus
    credit: samsung-tv-plus
    host: jmp2.uk
    path_prefix: /stvp-
  - name: Samsung TV Plus
    credit: samsung-tv-plus
    host: samsung.wurl.tv
  - name: Plex
    credit: plex
    host: plex.wurl.tv
  - name: The Roku Channel
    credit: roku-channel
    host: roku.wurl.tv
  - name: The Roku Channel
    credit: roku-channel
    host: delivery.roku.com
  - name: Tubi
    credit: tubi
    host: tubi.video
  - name: Tubi
    credit: tubi
    host: tubi.io
  - name: Rakuten TV
    credit: rakuten-tv
    host: fast.rakuten.tv
  - name: Xumo Play
    credit: xumo-play
    host: fast.nbcuni.com
    host_prefix: xumo-

# Licensed playout / distribution services that broadcasters pay to deliver their own channels.
# Streams here are accepted but grouped by the channel's category, like any broadcaster's stream.
distribution:
  - amagi.tv
  - wurl.tv
  - wurl.com
  - frequency.stream
  - uplynk.com
  - getpublica.com
  - ottera.tv
  - otteravision.com
  - stingray.com
  # Platforms US cities and public-access (PEG) channels use to stream their own channels.
  - cablecast.tv
  - telvue.com

# Delivery domains a broadcaster runs itself that don't match the channel's website domain.
broadcaster_hosts:
  getaj.net: Al Jazeera Media Network
  thehlive.com: Al Jazeera Media Network
  rtve.es: RTVE
  nhkworld.jp: NHK
  trt.com.tr: TRT
  ard-mcdn.de: ARD

# General-purpose CDNs. Anyone can rent these, so a stream on them is only accepted when the URL also names
# the broadcaster: the first label of the channel's website domain (e.g. "dw" for dw.com, "nasa" for nasa.gov)
# must start a host label, or (when at least 4 letters) appear in the URL path.
generic_cdns:
  - akamaized.net
  - akamaihd.net
  - cloudfront.net
  - amazonaws.com
  - streamlock.net
  - wowza.com
  - b-cdn.net
  - edgenextcdn.net
  - mdstrm.com
  - kwikmotion.com
  - streamhoster.com
  - brightcove.com
  - brightcovecdn.com
  - llnwi.net
  - fastly.net
  - azureedge.net
  - googlevideo.com
  - edgesuite.net
  - immergo.tv
  - ultrabase.net
  - dps.live

# Hosts that are never accepted, even if another rule would accept them: known restream and playlist-sharing hosts,
# and state media under UK/EU sanctions.
denied_domains:
  - freeott.top
  - freem3u.xyz
  - dethich.pw
  - githubusercontent.com
  - pastebin.com
  - smotrim.ru
  - rt.com
  - rttv.com

# When a channel's streams are all unverified, fetch the broadcaster's website (home page plus up to two "live"
# pages linked from it) and accept a stream whose exact host name the site mentions. Results are cached per site.
website_check:
  enabled: true
  ttl_days: 7
  max_sites: 2500   # at most this many sites fetched in one run

# Words too generic to identify a broadcaster in the generic-CDN rule.
generic_tokens: [tv, live, news, www, web, the, channel, stream, radio, media, play, video, hd, one, plus, cdn]
