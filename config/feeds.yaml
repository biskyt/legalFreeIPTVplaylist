# The feeds published on GitHub Pages.
#
# A feed has one content kind; its entries are rendered once. A combined feed is made by joining the rendered
# bodies of its member feeds under one header, without fetching, filtering or rendering anything again.
# `min_entries` guards against publishing a broken build (e.g. when an upstream API is down).

feeds:
  live:
    kind: live
    title: Live TV and FAST channels
    min_entries: 300
  movies:
    kind: movie
    title: Movies
    min_entries: 100
  series:
    kind: series
    title: TV series
    min_entries: 30

combined:
  vod:
    title: Movies and series
    members: [movies, series]
  playlist:
    title: Everything
    members: [live, movies, series]

# One playlist per language (languages/<ISO 639-3 code>.m3u), joined from the rendered member feeds, for every
# language with at least `min_entries` entries.
languages:
  members: [live, movies, series]
  min_entries: 10

# TV guide (XMLTV) for the live channels, published next to the playlists and announced in the url-tvg header of
# every playlist with live channels. The build writes the channel list; the workflow runs iptv-org's grabber.
guide: epg.xml.gz
