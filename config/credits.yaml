# Every source this project draws on. Each entry's `source` must have a record here (a test checks this), and the
# README's "Sources and credits" section is generated from this file:  python -m freeplaylist credits
#
#   name, url:    who to credit and where
#   provides:     what this project takes from them
#   license:      the licence or legal basis that makes it free to use
#   attribution:  the credit line they ask for (optional)
#   note:         anything a user should know (optional)
#   proof:        why entries from this source are kept (shown on credits.html; the rules are in legal.yaml)
#   terms:        the source's terms and conditions, linked from credits.html

sources:
  iptv-org:
    name: iptv-org
    url: https://github.com/iptv-org/iptv
    provides: Database of publicly available live TV channels and streams (channels, streams, logos, blocklist)
    license: Data published under the Unlicense (iptv-org/iptv and iptv-org/api)
    note: >-
      iptv-org collects links; it does not host streams or check that they are licensed. This project keeps only
      the streams it can show the owner publishes. Each channel belongs to its broadcaster; see credits.html for
      every channel and why it is included.
    proof: >-
      A live stream is kept only if it is served from the channel's own website domain, the channel's own website
      refers to the stream's host, or the host is run by the broadcaster itself. That shows the owner serves it
      openly; it is not a licence, so each channel's terms and conditions are linked.

  internet-archive:
    name: Internet Archive
    url: https://archive.org/
    provides: >-
      Films published before 1931, their metadata and thumbnails (collections feature_films, Film_Noir,
      SciFi_Horror, Comedy_Films, silent_films, classic_cartoons, prelinger)
    license: >-
      Public domain in the US by age: works published in 1930 or earlier entered it on 1 January 2026
    note: Files are streamed directly from archive.org. Consider donating at https://archive.org/donate
    terms: https://archive.org/about/terms.php
    proof: >-
      Only films the Internet Archive records as published before 1931, which are in the US public domain by age.

  blender:
    name: Blender Studio (Blender Foundation) open movies
    url: https://studio.blender.org/films/
    provides: Big Buck Bunny, Elephants Dream, Sintel, Tears of Steel, Cosmos Laundromat, Spring, Sprite Fright, Wing It!, Caminandes
    license: Creative Commons Attribution (CC BY 2.5 / 3.0 / 4.0, per film)
    attribution: "© Blender Foundation | studio.blender.org"
    note: Streamed from the Internet Archive's copies.
    terms: https://studio.blender.org/films/
    proof: Published by the Blender Foundation itself, which is the copyright holder, under CC BY.

  wikimedia-commons:
    name: Wikimedia Commons
    url: https://commons.wikimedia.org/
    provides: Public-domain and freely licensed films and videos (category "Films in the public domain")
    license: Public domain in the US and in the country of origin, or CC0 / CC BY / CC BY-SA, per file
    note: Each film's author and licence are listed in catalog.json and on its Commons page.
    terms: https://foundation.wikimedia.org/wiki/Policy:Terms_of_Use
    proof: >-
      Commons only keeps files that are free in the United States and in the country they come from; each file's
      page shows its licence and who vouched for it.

  iptv-epg-org:
    guide: true   # listed in the TV guide section of the site
    name: IPTV-EPG.org
    url: https://iptv-epg.org/
    provides: TV guide listings (XMLTV) for 75 countries, merged into our epg.xml.gz for the channels we list
    license: Free service; listings belong to the broadcasters. Ask us and we'll remove them
    note: Downloaded once a night, per country.

  iptv-org-epg:
    guide: true
    name: iptv-org/epg
    url: https://github.com/iptv-org/epg
    provides: The grabber that collects listings for the remaining channels from the guide sites it supports
    license: Software under the Unlicense; listings belong to the sites they come from
    note: Each channel is grabbed once a week, 8 days ahead, in a nightly rotation.
